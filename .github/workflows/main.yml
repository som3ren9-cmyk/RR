name: woobbie

on:
  workflow_dispatch:

jobs:
  launch-woobbie:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install and Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          args: --ssh --hostname=woobbie-${{ github.run_id }}

      - name: Setup SSH Password and Environment
        run: |
          # Set password for runner and root
          echo "runner:Admin@1234" | sudo chpasswd
          echo "root:Admin@1234" | sudo chpasswd

          # Enable SSH password authentication for WinSCP
          sudo sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?KbdInteractiveAuthentication .*/KbdInteractiveAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh

          # Launch Debian 12 with a shared workspace linked to runner home
          mkdir -p /home/runner/workspace
          sudo chown -R runner:runner /home/runner/workspace
          docker run -d --name woobbie --privileged --net=host -v /home/runner/workspace:/workspace debian:bookworm sleep infinity

          # Install packages inside Debian
          docker exec woobbie apt-get update
          docker exec woobbie apt-get install -y curl wget sudo nano htop git

          # Add shortcut command 'debian' to jump into Debian shell
          echo "alias debian='docker exec -it woobbie bash'" >> /home/runner/.bashrc

      - name: Display Connection Details and Keep Alive
        run: |
          TS_IP=$(tailscale ip -4)
          echo "======================================================"
          echo "Server 'woobbie' is ready for WinSCP and SSH."
          echo "Tailscale IP : $TS_IP"
          echo "Username     : runner"
          echo "Password     : Admin@1234"
          echo "Port         : 22"
          echo ""
          echo "Shared folder for WinSCP files: /home/runner/workspace"
          echo "======================================================"

          # Keep the session running
          while [ true ]; do
            echo "[$(date)] woobbie running active..."
            sleep 300
          done
