name: woobbie

on:
  workflow_dispatch:

jobs:
  launch-windows:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Verify Europe Datacenter Location
        run: |
          Write-Host "Checking runner geolocation..."
          $geo = Invoke-RestMethod -Uri "https://ipinfo.io/json"
          Write-Host "Runner IP       : $($geo.ip)"
          Write-Host "Runner Country  : $($geo.country)"
          Write-Host "Runner City     : $($geo.city)"

          # List of European countries common in Azure datacenters
          $europeCountries = @("NL", "IE", "FR", "DE", "GB", "ES", "IT", "BE", "SE", "PL", "CH", "AT", "NO", "FI")

          if ($geo.country -notin $europeCountries) {
              Write-Error "The assigned runner is NOT located in Europe (Current country: $($geo.country)). Cancelling execution..."
              exit 1
          }

          Write-Host "Location confirmed: The runner is active in Europe ($($geo.country)). Proceeding..."

      - name: Configure Remote Desktop Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Port" 2>$null
          netsh advfirewall firewall add rule name="RDP-Port" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create Administrator Account
        run: |
          $Username = "VPSAdmin"
          $PlainPassword = "WindowsVPS@2026#Pass"
          $SecurePassword = ConvertTo-SecureString $PlainPassword -AsPlainText -Force

          New-LocalUser -Name $Username -Password $SecurePassword -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $Username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $Username

      - name: Download and Install Tailscale
        run: |
          Write-Host "Downloading Tailscale..."
          $installerPath = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile $installerPath

          Write-Host "Installing Tailscale silently..."
          Start-Process -FilePath $installerPath -ArgumentList "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Connect to Tailscale Network
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=woobbie-$env:GITHUB_RUN_ID

          $tailscaleIP = $null
          $retries = 0
          while (-not $tailscaleIP -and $retries -lt 12) {
              $tailscaleIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tailscaleIP) {
              Write-Error "Failed to obtain Tailscale IP address."
              exit 1
          }

          echo "TAILSCALE_IP=$tailscaleIP" >> $env:GITHUB_ENV

      - name: Display Connection Details and Keep Alive
        run: |
          Write-Host "========================================================"
          Write-Host "Server 'woobbie' is ready for RDP connection."
          Write-Host "RDP Address : $env:TAILSCALE_IP"
          Write-Host "Hostname    : woobbie-$env:GITHUB_RUN_ID"
          Write-Host "Username    : VPSAdmin"
          Write-Host "Password    : WindowsVPS@2026#Pass"
          Write-Host "Port        : 3389"
          Write-Host "========================================================"

          while ($true) {
              Write-Host "[$(Get-Date)] woobbie running active in Europe..."
              Start-Sleep -Seconds 300
          }
