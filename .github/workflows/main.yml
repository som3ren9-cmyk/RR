name: Windows-10-VPS

on:
  workflow_dispatch:

jobs:
  launch-windows:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Configure Remote Desktop Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Port" 2>$null
          netsh advfirewall firewall add rule name="RDP-Port" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create Administrator Account
        run: |
          $Username = "VPSAdmin"
          $PlainPassword = "WindowsVPS@2026#Pass"
          $SecurePassword = ConvertTo-SecureString $PlainPassword -AsPlainText -Force

          New-LocalUser -Name $Username -Password $SecurePassword -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $Username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $Username

      - name: Install Tailscale
        run: |
          winget install Tailscale.Tailscale --silent --accept-package-agreements --accept-source-agreements

      - name: Connect to Tailscale
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=win10-vps-$env:GITHUB_RUN_ID

          $tailscaleIP = $null
          $retries = 0
          while (-not $tailscaleIP -and $retries -lt 12) {
              $tailscaleIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tailscaleIP) {
              Write-Error "Failed to get Tailscale IP."
              exit 1
          }

          echo "TAILSCALE_IP=$tailscaleIP" >> $env:GITHUB_ENV

      - name: Display Connection Info and Keep Alive
        run: |
          Write-Host "========================================================"
          Write-Host "Windows VPS is ready for Remote Desktop connection."
          Write-Host "RDP IP Address : $env:TAILSCALE_IP"
          Write-Host "Username       : VPSAdmin"
          Write-Host "Password       : WindowsVPS@2026#Pass"
          Write-Host "Port           : 3389"
          Write-Host "========================================================"

          while ($true) {
              Write-Host "[$(Get-Date)] Windows VPS running..."
              Start-Sleep -Seconds 300
          }
